[package]
name = "reality"
version = "0.1.0"
edition = "2021"
description = "A Standard Model particle physics simulation library and toolkit"

[[bin]]
name = "reality"
path = "src/main.rs"

[lib]
name = "reality"
path = "src/lib.rs"

[dependencies]
num-complex = "0.4"
rand = "0.9"
rand_distr = "0.5"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
