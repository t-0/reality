# Matches the standard vectorlike Q + D unification setup in the literature (e.g. arXiv:2006.01406).
# Found by `reality search`: alpha_s(M_Z) = 0.1181 at two loops, pull -0.03,
# M_GUT = 8.48e15 GeV, proton lifetime ~2.0e35 years.
name = "SM + Dirac (3,2,1/6) @ 1e4 GeV + Dirac (3,1,-1/3) @ 3e7 GeV"
inputs = ["alpha_1", "alpha_2"]

[[field]]
name = "Dirac (3,2,1/6)"
kind = "dirac"
su3 = "3"
su2 = 2
y = "1/6"
mass = 1e4

[[field]]
name = "Dirac (3,1,-1/3)"
kind = "dirac"
su3 = "3"
su2 = 1
y = "-1/3"
mass = 3.162e7
