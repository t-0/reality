# Rediscovered blind: split-SUSY fermions (wino, gluino, higgsinos) plus a second Higgs doublet at 1 TeV.
# Found by `reality search`: alpha_s(M_Z) = 0.1186 at two loops, pull -0.23,
# M_GUT = 1.61e16 GeV, proton lifetime ~2.3e36 years.
name = "SM + Weyl (1,3,0) @ 1e3 GeV + Weyl (8,1,0) @ 1e3 GeV + Dirac (1,2,1/2) @ 1e3 GeV + Scalar (1,2,1/2) @ 1e3 GeV"
inputs = ["alpha_1", "alpha_2"]

[[field]]
name = "Weyl (1,3,0)"
kind = "weyl"
su3 = "1"
su2 = 3
y = "0"
mass = 1e3

[[field]]
name = "Weyl (8,1,0)"
kind = "weyl"
su3 = "8"
su2 = 1
y = "0"
mass = 1e3

[[field]]
name = "Dirac (1,2,1/2)"
kind = "dirac"
su3 = "1"
su2 = 2
y = "1/2"
mass = 1e3

[[field]]
name = "Scalar (1,2,1/2)"
kind = "complex_scalar"
su3 = "1"
su2 = 2
y = "1/2"
mass = 1e3
